<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DRIVE Performance System</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #app-frame { width: 100%; height: 100%; border: none; display: block; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #ffffff; z-index: 9999; transition: opacity 0.3s ease; }
    .spinner { width: 42px; height: 42px; border: 4px solid rgba(255, 255, 255, 0.2); border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div style="font-size: 15px; font-weight: 600; letter-spacing: 0.5px;">Memuat DRIVE Performance System...</div>
  </div>
  <!-- Ganti URL_WEB_APP_EXEC_ANDA dengan link Web App Apps Script Anda -->
  <iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbxRkni2j9Y6VzSFExGG_zggCySK5_WGFl4vUre6Yy9B7qSKSwnklznyBQVw9Mov-IAojQ/exec" allow="clipboard-read; clipboard-write" onload="document.getElementById('loader').style.display='none';"></iframe>
</body>
</html>
